<body>
  <header class="site-header">

      <button type="button" role="tab" data-tab="changelog"></button>
      <button type="button" role="tab" data-tab="roadmap"></button>
    </nav>
    <aside id="right">
      <section id="changelog" class="panel tabbed"></section>
      <section id="roadmap" class="panel tabbed"></section>
      <section id="share" class="panel"></section>
      <section id="feedback" class="panel"></section>
    </aside>
  </main>
  <script type="module" src="/src/main.ts"></script>
